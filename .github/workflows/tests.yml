name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.8", "3.10", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git identity for the temporary test repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: Run tests (standard library only, no pip install)
        run: python -m unittest discover -s tests -v
      - name: Benchmark
        run: python bench/run_bench.py
      - name: Demo
        run: python examples/run_demo.py
